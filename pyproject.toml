[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "permita38"
dynamic = ["version"]  # single source: permita38/__init__.py (PEP 440); see RELEASING.md
description = "Time tracking, planning, offers, invoices and tax reserves for freelancers and small businesses in Germany."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6",
    "python-multipart>=0.0.9",
    "segno>=1.6",
    "zxing-cpp>=3",  # receipt scan: QR codes (TSE, GiroCode)
    "pypdfium2>=5",  # receipt scan: PDF text, embedded e-invoice XML, page rendering
    "tzdata",   # zoneinfo needs a time zone database: Windows and slim containers have none
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "pytest-xdist>=3.5",  # the randomized and browser suites run on several workers (make test-random / test-web)
    "playwright==1.64.1",
    "ruff",
    "mypy",
    "types-PyYAML",
]
# tools used by the release workflow and scripts/ (not needed to run or develop the app)
release = ["build", "twine", "pyinstaller", "cyclonedx-bom", "pytest-cov", "packaging"]

[project.scripts]
permita38 = "permita38.cli.main:main"

[project.urls]
Source = "https://github.com/roggenbrot42/permitA38"

[tool.setuptools.dynamic]
version = {attr = "permita38.__version__"}

[tool.setuptools.packages.find]
include = ["permita38*"]

[tool.setuptools.package-data]
"permita38.core" = ["templates/*.json"]
"permita38.core.trip_rates" = ["*.json"]
"permita38.core.tax_rules" = ["*.json"]
"permita38.core.vat_rules" = ["*.json"]
"permita38.core.datev" = ["*.json"]
"permita38.core.charts" = ["*.json"]
"permita38.core.schema" = ["migrations/*/*.sql"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".git", ".venv*", "web", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["permita38.core.accounting.*", "permita38.core.vat.*", "permita38.core.vat_rules.*", "permita38.core.datev.*", "permita38.core.charts.*", "permita38.core.service.fiscal_years", "permita38.core.service.journal", "permita38.core.service.locks", "permita38.core.service.postings", "permita38.core.service.invoice_state", "permita38.core.service.payments", "permita38.core.service.credit_notes", "permita38.core.service.expense_postings", "permita38.core.service.trip_postings", "permita38.core.service.tax_bookings", "permita38.core.service.vat_returns"]
# mypy has no per-module `strict`; these are the flags `--strict` enables
strict_equality = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
extra_checks = true

[tool.pytest.ini_options]
minversion = "8.0"
# `pytest` runs the fast backend suite. The randomized and browser suites are selected explicitly
# (make test-random / test-web, or pass their path).
testpaths = ["tests/backend", "tests/release"]
markers = [
    "randomized: model-based and fuzz tests driven by random input (tests/backend/randomized)",
    "e2e_random: seeded random user simulations over HTTP and in the browser (tests/web/e2e_random)",
    "monkey_walk: unbounded random UI walk, nightly only in CI (tests/web/e2e_random/test_monkey.py)",
    "web: tests that drive the web UI in a real browser (tests/web)",
]
