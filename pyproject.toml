[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "permita38"
version = "0.3.0"
description = "Time tracking, planning, offers, invoices and tax reserves for freelancers and small businesses in Germany."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6",
    "python-multipart>=0.0.9",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "playwright==1.64.0",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
permita38 = "permita38.cli.main:main"

[project.urls]
Source = "https://github.com/roggenbrot42/permitA38"

[tool.setuptools.packages.find]
include = ["permita38*"]

[tool.setuptools.package-data]
"permita38.core" = ["templates/*.json"]
"permita38.core.schema" = ["migrations/*/*.sql"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".venv*", "web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
# `pytest` runs the fast backend suite. The randomized and browser suites are selected explicitly
# (make test-random / test-web, or pass their path).
testpaths = ["tests/backend"]
markers = [
    "randomized: model-based and fuzz tests driven by random input (tests/backend/randomized)",
    "e2e_random: seeded random user simulations over HTTP and in the browser (tests/web/e2e_random)",
    "web: tests that drive the web UI in a real browser (tests/web)",
]
