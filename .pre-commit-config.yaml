repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^docker-compose\.proxy\.yml$ # uses Compose's !reset tag (validated by `docker compose config`)
      - id: end-of-file-fixer
        exclude: ^(api/openapi\.json|LICENSE)$
      - id: trailing-whitespace
        exclude: ^LICENSE$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
