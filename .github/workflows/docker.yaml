# Pull-request validation of the image only. Publishing to ghcr.io happens in release.yaml (on tags), together with the
# smoke test, SBOM and provenance attestation.
name: Docker
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose*.yml
      - permita38/**
      - web/**
      - pyproject.toml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate compose files
        run: |
          docker compose config -q
          PERMITA38_DOMAIN=permita.example.com docker compose -f docker-compose.yml -f docker-compose.proxy.yml config -q
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
