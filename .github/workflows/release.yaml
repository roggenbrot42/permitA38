# Release pipeline. Trigger: pushing an annotated tag vX.Y.Z[-alpha.N|-beta.N|-rc.N] (see RELEASING.md).
# Manual runs (workflow_dispatch) are dry runs: everything is built and tested, nothing is published.
#
# Action pins: every third-party action is pinned to a full commit SHA; the comment names the release the SHA belongs
# to. Dependabot (.github/dependabot.yml) proposes updates. Re-verify a pin with:  git ls-remote --tags https://github.com/<owner>/<repo>
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to dry-run, e.g. 0.4.0-alpha.1 (must match the package version of the selected ref)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.info.outputs.version }}
      pep440: ${{ steps.info.outputs.pep440 }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Re-fetch the tag object (checkout can turn annotated tags into lightweight ones)
        if: env.PUBLISH == 'true'
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
      - name: Tag format, annotated tag, package version and CHANGELOG must agree
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python scripts/release.py check "$TAG" --require-annotated
          else
            python scripts/release.py check "$TAG"
          fi
      - id: info
        run: python scripts/release.py info "$TAG" --github-output
      - name: Tag signature information
        if: env.PUBLISH == 'true'
        run: |
          # Informational: GitHub cannot verify maintainer-local signing keys without them being uploaded; see RELEASING.md.
          git for-each-ref "refs/tags/${TAG}" --format='tagger: %(taggername) %(taggeremail)%0aobject: %(objecttype) %(objectname)'
          git tag -v "$TAG" 2>&1 || echo "::notice::tag signature not verifiable on the runner (key not imported); GitHub shows its own 'Verified' badge"
      - name: The tag must point at a commit on main
        if: env.PUBLISH == 'true'
        run: |
          git merge-base --is-ancestor "$TAG^{commit}" origin/main \
            || { echo "::error::$TAG is not contained in main: releases are cut from main only"; exit 1; }

  test:
    name: Tests (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Lint (Linux only)
        if: runner.os == 'Linux'
        run: |
          python -m ruff check
          python -m ruff format --check
          python -m mypy permita38
          python -m permita38 show-openapi | diff -u api/openapi.json - 
      - name: Backend and release-tooling tests
        run: python -m pytest tests/backend tests/release -q
      - name: Runtime dependency licenses are GPLv3-compatible
        run: python scripts/generate_notices.py --check-licenses

  dist:
    name: sdist and wheel
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: "1577836800"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine cyclonedx-bom
      - name: Build
        run: python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Artifact versions match the tag
        env:
          PEP440: ${{ needs.validate.outputs.pep440 }}
        run: |
          ls dist
          test -f "dist/permita38-${PEP440}.tar.gz"
          test -f "dist/permita38-${PEP440}-py3-none-any.whl"
      - name: Clean install of the wheel and smoke test
        env:
          PEP440: ${{ needs.validate.outputs.pep440 }}
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "dist/permita38-${PEP440}-py3-none-any.whl"
          /tmp/venv/bin/python -c "import permita38, sys; assert permita38.__version__ == sys.argv[1], permita38.__version__" "$PEP440"
          /tmp/venv/bin/permita38 --help > /dev/null
          /tmp/venv/bin/python -c "from importlib.resources import files; assert files('permita38.core.schema').joinpath('migrations/sqlite/0001-initial.sql').is_file()"
          SMOKE_EXPECT_WEB=0 /tmp/venv/bin/python packaging/smoke_test.py /tmp/venv/bin/permita38
      - name: CycloneDX SBOM of the installed application
        run: python -m cyclonedx_py environment /tmp/venv --of JSON -o dist/permita38-sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  bundle:
    name: Standalone bundle (${{ matrix.platform }})
    needs: [validate, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          # ubuntu-22.04 on purpose: a bundle built against an older glibc runs on more distributions
          - {os: ubuntu-22.04, platform: linux-x86_64, exe: dist/permita38/permita38}
          - {os: windows-latest, platform: windows-x86_64, exe: dist/permita38/permita38.exe}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SOURCE_DATE_EPOCH: "1577836800"
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies and PyInstaller
        run: |
          python -m pip install -c docker/constraints.txt .
          python -m pip install pyinstaller
      - run: python -m PyInstaller packaging/permita38.spec --noconfirm --clean
      - name: Smoke test the built program
        run: python packaging/smoke_test.py "${{ matrix.exe }}"
      - name: Create the archive
        run: python packaging/make_bundle.py --platform "${{ matrix.platform }}" --version "$VERSION" --out release
      - name: Smoke test the archive contents (what users download)
        run: |
          mkdir unpacked
          if [ "${{ matrix.platform }}" = windows-x86_64 ]; then
            python -m zipfile -e release/*.zip unpacked
            python packaging/smoke_test.py unpacked/permita38-*/permita38.exe
          else
            tar -xzf release/*.tar.gz -C unpacked
            python packaging/smoke_test.py unpacked/permita38-*/permita38
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  docker:
    name: Container image (ghcr.io)
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # build provenance attestation
      attestations: write
    env:
      IMAGE: ghcr.io/roggenbrot42/permita38
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: has
        name: Is there a Dockerfile?
        run: |
          if [ -f Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::warning::no Dockerfile: skipping the image"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.present == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.has.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and smoke test the image (amd64)
        if: steps.has.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: permita38:smoke
      - name: Container answers on /api/health and runs unprivileged
        if: steps.has.outputs.present == 'true'
        run: |
          docker run -d --name p38 -p 127.0.0.1:8765:8765 permita38:smoke
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/api/health
          test "$(docker exec p38 id -u)" != "0"
          docker rm -f p38
      - name: Log in to ghcr.io
        if: steps.has.outputs.present == 'true' && env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.has.outputs.present == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
      - id: push
        name: Build multi-arch (and push when this is a real release)
        if: steps.has.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest image provenance
        if: steps.has.outputs.present == 'true' && env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Draft GitHub release
    needs: [validate, dist, bundle, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release # configure required reviewers on this environment (docs/maintainer-setup.md)
    permissions:
      contents: write # create the release
      id-token: write # attestations
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          rm -f SHA256SUMS
          sha256sum -- * | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance of all files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          python3 scripts/release.py notes "$VERSION" > notes.md
          {
            echo
            echo "---"
            echo "Verify your download: \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
            echo "Container image: \`ghcr.io/roggenbrot42/permita38:${VERSION}\`."
          } >> notes.md
      - name: Create the draft release (a maintainer reviews and publishes it)
        run: |
          flags=(--draft --verify-tag --title "permitA38 ${TAG}" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}" artifacts/*
