name: Nightly randomized tests
# Long, non-deterministic exploration. A failure prints the hypothesis blob / seed to replay it
# (see tests/backend/randomized/README.md and tests/web/e2e_random/README.md).
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds for the web/API journeys (space separated, empty = random)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backend-thorough:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Hypothesis "thorough" profile
        env:
          HYPOTHESIS_PROFILE: thorough
        run: python -m pytest tests/backend/randomized -q -p no:cacheprovider
      - name: Keep failing examples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-examples
          path: .hypothesis
          if-no-files-found: ignore

  web-random-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Fresh seeds for journeys, monkey and API sessions
        env:
          PERMITA38_E2E_SEED: ${{ github.event.inputs.seeds }}
        run: |
          if [ -z "$PERMITA38_E2E_SEED" ]; then
            PERMITA38_E2E_SEED="$(python -c 'import random; print(*[random.randrange(1, 10**6) for _ in range(6)])')"
            export PERMITA38_E2E_SEED
          fi
          echo "seeds: $PERMITA38_E2E_SEED"
          python -m pytest tests/web -q -p no:cacheprovider
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-screenshots
          path: /tmp/e2e_*.png
          if-no-files-found: ignore
