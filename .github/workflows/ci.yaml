name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: make ruff
      - run: make check-format
      - run: make mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        # pull requests: Windows only on 3.13 (OCR download step); push to main keeps the full matrix
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"windows-latest","python":"3.12"},{"os":"windows-latest","python":"3.14"}]') || fromJSON('[]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tesseract (OCR test of the receipt scan)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/backend -q
      - name: Download the OCR package and read a fake PNG with it (59 MB, once)
        if: runner.os == 'Windows' && matrix.python == '3.13'
        env:
          PERMITA38_OCR_DOWNLOAD: "1"
        run: python -m pytest tests/backend/test_receipt_ocr_download.py -q

  random:
    # randomized API tests (hypothesis state machine + schema fuzzer), deterministic "ci" profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: make test-random

  web:
    # browser UI + live-server random user simulations (Playwright / Chromium), default seeds only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Browser tests
        shell: bash
        run: |
          set +e
          python -m pytest tests/web -m "not monkey_walk" -q -n 4 --dist worksteal -rfE --tb=short -p no:cacheprovider 2>&1 | tee /tmp/web-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            # surface the result as an annotation so it is visible without downloading logs
            msg=$(tail -n 60 /tmp/web-tests.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=web tests (exit $status)::${msg:0:30000}"
          fi
          exit "$status"
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-screenshots
          path: /tmp/e2e_*.png
          if-no-files-found: ignore

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: api/openapi.json must be up to date (run `make generate-openapi`)
        run: make check-openapi
