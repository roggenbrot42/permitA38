version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message: {prefix: "chore(deps)"}
    # packages that pin each other exactly: one pull request per group, so docker/constraints.txt never holds a
    # combination pip cannot resolve (pydantic pins pydantic-core==x; fastapi pins a starlette range)
    groups:
      pydantic:
        patterns: ["pydantic", "pydantic-core"]
      fastapi:
        patterns: ["fastapi", "starlette"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    labels: [dependencies]
    commit-message: {prefix: "ci(deps)"}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    labels: [dependencies]
    commit-message: {prefix: "build(deps)"}
